name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build win-x64 and publish Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish (self-contained)
        shell: bash
        run: |
          dotnet publish Plain-Craft-Launcher-2.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -p:PublishSingleFile=false \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o publish/app

      - name: Zip package
        shell: bash
        run: |
          cd publish
          powershell -Command "Compress-Archive -Path app/* -DestinationPath PCL-Pro-N-v${{ steps.version.outputs.version }}-win-x64.zip -Force"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: "PCL Pro-N v${{ steps.version.outputs.version }}"
          body: |
            ## PCL Pro-N v${{ steps.version.outputs.version }}

            自动构建产物（自包含版，无需安装 .NET 8）：
            - `PCL-Pro-N-v${{ steps.version.outputs.version }}-win-x64.zip` —— 解压后运行 `Plain Craft Launcher 2.exe`
          files: publish/PCL-Pro-N-*.zip
          draft: false
          prerelease: false

      - name: Upload artifact (workflow_dispatch)
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: PCL-Pro-N-v${{ steps.version.outputs.version }}-win-x64
          path: publish/PCL-Pro-N-*.zip
