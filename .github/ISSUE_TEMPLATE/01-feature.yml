name: "📫 新功能投稿栏"
description: "提交一个新功能想法，或现有体验的改进建议"
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢投稿！PCL Professional-Next 是社区「二改的二改」分支，由 CCief 个人维护，人力有限，投稿不一定都会被实现，但每条都会看。

        请尽量写清「在什么场景下、想解决什么问题」，比只写一句「希望加个 XXX」更容易推进。

  - type: input
    id: summary
    attributes:
      label: "一句话概括"
      description: "用一句话说清你想要的功能"
      placeholder: "例：下载页支持按实例加载器批量筛选模组"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: "涉及范围"
      options:
        - "下载 / 模组"
        - "版本 / 加载器匹配"
        - "界面 / 交互"
        - "启动 / 游戏内"
        - "其他"
      default: 0
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: "使用场景与期望效果"
      description: "什么情况下会用到？理想中应该表现成什么样？"
      placeholder: "例：装了 30 个 mod 时想只装 Fabric 版文件，希望列表直接过滤掉 Forge 版……"
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: "现在是怎么处理的（可选）"
      description: "目前有没有临时替代办法，或者为什么现有功能不够用"

  - type: checkboxes
    id: confirm
    attributes:
      label: "提交前确认"
      options:
        - label: "我已搜索过已有 Issue，确认不是重复投稿"
          required: true
        - label: "我了解本项目与上游 PCL2 / PCL Pro 作者无隶属关系"
          required: false
